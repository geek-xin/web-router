name: Release

# Builds every release asset for the three supported platforms plus the
# portable JAR distribution, then publishes them to a GitHub Release.
#
#   git tag v1.3.0 && git push origin v1.3.0     -> automatic release
#   Actions -> Release -> Run workflow           -> manual release
#
# Assets (contract names, see docs/PACKAGING.md):
#   wrouter-<version>-jar.zip | .tar.gz
#   wrouter-<version>-<platform>-app.zip | .tar.gz
#   wrouter-<version>-<platform>.dmg | .deb | .rpm | .exe
#   SHA256SUMS.txt
#
# The names must match src/main/java/com/geek/webrouter/web/support/ReleaseAssets.java,
# which the in-app updater uses to pick a download; build-release.sh fails the
# build when an asset violates that contract.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and release, for example 1.3.0. Defaults to the version in pom.xml.'
        required: false
        type: string
      prerelease:
        description: 'Mark the GitHub Release as a pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  APP_NAME: wrouter

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- build ---
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The JAR distribution is platform independent, so it is built once
          # (on macos-14) instead of four times; every other entry only builds
          # its own platform specific assets.
          - os: macos-14
            platform: macos-arm64
            types: jar,app-image,installer
          # macos-13 was retired (December 2025); macos-15-intel is the
          # supported Intel runner and is what builds the macos-x64 assets.
          - os: macos-15-intel
            platform: macos-x64
            types: app-image,installer
          - os: ubuntu-latest
            platform: linux-x64
            types: app-image,installer
          - os: windows-latest
            platform: windows-x64
            types: app-image,installer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -eu
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version=$(sed -n 's|.*<version>\(.*\)</version>.*|\1|p' pom.xml | head -n 1)
          fi
          version=$(printf '%s' "${version}" | tr -d '[:space:]')
          [ -n "${version}" ] || { echo "could not resolve a version" >&2; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version}"

      - name: Build frontend
        shell: bash
        working-directory: frontend
        run: |
          set -eu
          npm ci
          npm run build
          ls -la ../src/main/resources/static/admin

      # jpackage --type deb/rpm shells out to dpkg-deb / rpmbuild, which are
      # not preinstalled on ubuntu-latest.
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot rpm

      # shell: bash also works on windows-latest (Git Bash), so one step drives
      # the identical script on every matrix entry.
      - name: Build release assets
        shell: bash
        env:
          WROUTER_VERSION_OVERRIDE: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          scripts/build-release.sh --platform "${{ matrix.platform }}" --only "${{ matrix.types }}" --skip-tests

      - name: Show assets
        shell: bash
        run: ls -la target/release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: target/release/*
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------- publish ---
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -eu
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
          else
            version=$(sed -n 's|.*<version>\(.*\)</version>.*|\1|p' pom.xml | head -n 1)
          fi
          version=$(printf '%s' "${version}" | tr -d '[:space:]')
          [ -n "${version}" ] || { echo "could not resolve a version" >&2; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        working-directory: artifacts
        run: |
          set -eu
          rm -f SHA256SUMS.txt
          find . -maxdepth 1 -type f \
            ! -name 'SHA256SUMS.txt' ! -name 'release-manifest.txt' -print0 \
            | xargs -0 shasum -a 256 > SHA256SUMS.txt
          sed -i 's|\./||' SHA256SUMS.txt
          LC_ALL=C sort -k2 SHA256SUMS.txt -o SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt
          echo "--- assets ---"
          ls -la

      - name: Build release notes
        shell: bash
        run: |
          set -eu
          v="${{ steps.version.outputs.version }}"
          tag="v${v}"
          {
            echo "## wrouter ${v}"
            echo
            echo "### 下载 / Downloads"
            echo
            echo "| 方式 | 文件 |"
            echo "| --- | --- |"
            echo "| 免安装 · macOS Apple Silicon | \`wrouter-${v}-macos-arm64-app.zip\` |"
            echo "| 免安装 · macOS Intel | \`wrouter-${v}-macos-x64-app.zip\` |"
            echo "| 免安装 · Windows x64 | \`wrouter-${v}-windows-x64-app.zip\` |"
            echo "| 免安装 · Linux x64 | \`wrouter-${v}-linux-x64-app.tar.gz\` |"
            echo "| 安装包 | \`wrouter-${v}-<platform>.(dmg/deb/rpm/exe)\` |"
            echo "| 传统 JAR 部署 | \`wrouter-${v}-jar.zip\` |"
            echo
            echo "校验下载内容：\`shasum -a 256 -c SHA256SUMS.txt\`"
            echo
            echo "未签名应用首次打开的系统提示与解决办法见 \`docs/PACKAGING.md\`。"
            echo
            echo "### 提交 / Commits"
            echo
            if git rev-parse "${tag}" >/dev/null 2>&1; then
              git log --no-decorate --pretty='- %h %s' -n 40 "${tag}"
            else
              git log --no-decorate --pretty='- %h %s' -n 40 HEAD
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: wrouter v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            artifacts/*
